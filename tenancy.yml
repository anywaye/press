version: 1
service: press

accountScoped: true

scope:
  key: tenant_id
  sources:
    - internal
    - migrations
  nonRowSites:
    - file: internal/ingest/store.go
      line: 33
      reason: the receipt INSERT's column list — tenant_id is a column the verified account is bound into, not a predicate; an insert stamps a new row instead of reaching an existing one
    - file: internal/builds/store.go
      line: 76
      reason: the build INSERT's column list — the tenant is stamped from the receipt the ingest recorded; a write of the caller's own account, not a predicate
    - file: internal/builds/store.go
      line: 96
      reason: the column list of the by-id read Get (WHERE id = $1, no tenant predicate) — the tenant is read back from the row, never filtered on; not caller-reachable and declared as unscoped in the prose above
    - file: internal/builds/store.go
      line: 184
      reason: the claim's RETURNING list — the claimed row's own tenant is read back; the claim is fleet-wide and deliberately has no tenant predicate, the boundary is the worker's comparison at worker.go:127
    - file: internal/builds/store.go
      line: 204
      reason: the receipt read's column list (WHERE id = $1, no tenant predicate) — the tenant is read back so the worker can compare it against the build's before anything is fetched or uploaded
    - file: internal/builds/store_test.go
      line: 57
      reason: the gated store test's INSERT column list (seedReceiptAndBuild) — test setup writing both rows through the real table; a fixture, not a predicate
    - file: migrations/00001_press.sql
      line: 39
      reason: the ingest_receipts index definition — the key as the index's leading column so a tenant's ordered reads can use it; DDL naming a column, not a statement reaching a row
    - file: migrations/00001_press.sql
      line: 54
      reason: the builds index definition — the key as the index prefix, same reading; DDL rather than a row predicate

rls:
  databaseEnforced: false
  sources:
    - migrations
  tables: []

entryPoints:
  - id: ingest-receipt
    operation: call
    subject: ingest_receipts
    enforced:
      mechanism: repository-method
      file: internal/ingest/store.go
      line: 33
    negative:
      asserts: absent
      cases:
        - id: no-identity
          asserts: absent
          expects: s.calls
          file: internal/ingest/ingest_test.go
          line: 208
        - id: other-account
          asserts: absent
          expects: s.calls
          file: internal/ingest/ingest_test.go
          line: 314
        - id: own-account
          asserts: present
          expects: receipt.Tenant
          file: internal/ingest/ingest_test.go
          line: 155

  - id: build-claim
    operation: update
    subject: builds
    enforced:
      mechanism: repository-method
      file: internal/builds/store.go
      line: 184
    negative:
      asserts: absent
      cases:
        - id: no-identity
          asserts: absent
          expects: runner.calls
          file: internal/builds/worker_test.go
          line: 284
        - id: other-account
          asserts: absent
          expects: runner.calls
          file: internal/builds/worker_test.go
          line: 259
        - id: own-account
          asserts: present
          expects: up.prefix
          file: internal/builds/worker_test.go
          line: 211

