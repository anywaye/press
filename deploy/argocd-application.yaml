apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: press
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: oci://ghcr.io/anywaye/charts/press
    chart: press
    targetRevision: 0.1.4
  destination:
    server: https://kubernetes.default.svc
    namespace: press
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
